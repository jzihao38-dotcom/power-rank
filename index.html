<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>次神：光之觉醒 · 区服战力榜</title>
<style>
  :root{
    --bg:#0b0f16; --bg2:#111825; --card:#141c2b; --line:#22304a;
    --txt:#e8eefc; --dim:#8fa3c4; --accent:#5b8cff; --up:#28c76f; --down:#ff5b6e;
    --pvp:#a06bff;
  }
  html[data-theme="light"]{
    --bg:#f4f6fb; --bg2:#ffffff; --card:#ffffff; --line:#e2e8f4;
    --txt:#16233a; --dim:#65748f; --accent:#2f6bff; --pvp:#7c3aed;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:radial-gradient(1200px 600px at 20% -10%,var(--bg2),var(--bg)) fixed;
    color:var(--txt);font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}

  /* ---------- 顶栏 ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,var(--accent),#9b6bff);box-shadow:0 8px 24px rgba(91,140,255,.35)
  }
  h1{margin:0;font-size:21px;letter-spacing:.3px}
  .sub{margin:2px 0 0;color:var(--dim);font-size:12.5px}
  .sub b{color:var(--txt);font-weight:600}
  .scope{color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);
         border-radius:6px;padding:1px 7px;font-size:11.5px}
  .adminbar{display:inline-flex;align-items:center;gap:8px}
  .adminbar .tag{color:var(--dim);font-size:11.5px}
  .ghost{
    background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:10px;
    padding:7px 13px;cursor:pointer;font-size:13px;transition:.18s
  }
  .ghost:hover{color:var(--txt);border-color:var(--accent)}

  /* ---------- KPI ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{
    background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--card) 88%,transparent));
    border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden
  }
  .kpi::after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent);opacity:.75}
  .kpi .k{color:var(--dim);font-size:12px;letter-spacing:.6px}
  .kpi .v{font-size:26px;font-weight:700;letter-spacing:.5px;margin-top:6px;font-variant-numeric:tabular-nums}
  .kpi .t{font-size:12px;margin-top:2px;color:var(--dim)}
  .kpi .t .up{color:var(--up)} .kpi .t .down{color:var(--down)}

  /* ---------- 面板 ---------- */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 20px;margin-bottom:18px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.4px}
  h2 .tag{font-size:11px;color:var(--dim);font-weight:400;margin-left:8px}

  /* ---------- 分段按钮 ---------- */
  .segs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:2px}
  .seg button{
    background:transparent;border:0;color:var(--dim);font-size:12px;padding:5px 12px;border-radius:8px;
    cursor:pointer;transition:.15s;font-family:inherit
  }
  .seg button.on{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--txt);font-weight:600}

  /* ---------- 图表 ---------- */
  .chart-wrap{width:100%;height:290px}
  svg{display:block;width:100%;height:100%;overflow:visible}
  .grid line{stroke:var(--line);stroke-width:1}
  .grid text{fill:var(--dim);font-size:10.5px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{
    display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;
    padding:4px 11px;font-size:12.5px;cursor:pointer;user-select:none;transition:.15s;color:var(--dim)
  }
  .chip:hover{color:var(--txt)}
  .chip.on{color:var(--txt);border-color:currentColor;background:color-mix(in srgb,currentColor 9%,transparent)}
  .dot{width:9px;height:9px;border-radius:50%;background:currentColor}

  /* ---------- 工具条 ---------- */
  input[type=search]{
    background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;
    color:var(--txt);font-size:13px;outline:none;width:200px
  }
  input[type=search]:focus{border-color:var(--accent)}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  button.chip{
    background:var(--bg2);border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;font-size:12.5px;color:var(--txt);cursor:pointer;white-space:nowrap
  }
  button.chip:hover{border-color:var(--accent)}
  button.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .linkbtn{background:none;border:0;color:var(--dim);font-size:12.5px;cursor:pointer;padding:6px 2px;font-family:inherit}
  .linkbtn:hover{color:var(--accent)}

  /* ---------- 表格 ---------- */
  .tbl-scroll{overflow:auto;max-height:78vh}
  tr.mine td{background:rgba(91,140,255,.10)}
  tr.mine .srvname::after{
    content:'我的区';font-size:10px;margin-left:6px;padding:1px 5px;border-radius:6px;
    background:var(--accent);color:#fff;vertical-align:middle
  }
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  thead th{
    text-align:left;font-size:11.5px;letter-spacing:.8px;color:var(--dim);font-weight:500;
    padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)
  }
  thead th.sortable{cursor:pointer;user-select:none;transition:color .15s}
  thead th.sortable:hover{color:var(--txt)}
  thead th.on{color:var(--accent)}
  thead th .arw{font-size:9px;opacity:0;margin-left:3px}
  thead th.on .arw{opacity:1}
  tbody td{padding:9px 10px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);white-space:nowrap}
  tbody tr{transition:background .15s;cursor:pointer}
  tbody tr:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .rk{
    width:34px;height:26px;border-radius:8px;display:grid;place-items:center;
    font-weight:700;font-size:13px;background:color-mix(in srgb,var(--line) 65%,transparent);color:var(--dim)
  }
  .rk.r1{background:linear-gradient(135deg,#ffc861,#ff9d3c);color:#2a1a00}
  .rk.r2{background:linear-gradient(135deg,#dbe4f2,#a9bad4);color:#1a2130}
  .rk.r3{background:linear-gradient(135deg,#e8a06a,#c9713a);color:#2a1405}
  .mv{font-size:12px;font-weight:600;min-width:44px;display:inline-block}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)}
  .srvname{font-weight:600}
  .srvname small{display:block;font-size:11px;color:var(--dim);font-weight:400}
  .pw{font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
  .pw .d{display:block;font-size:10.5px;font-weight:500}
  .pw.alpha{font-family:"JetBrains Mono",Consolas,"Courier New",monospace;letter-spacing:.4px}
  .bar{height:5px;border-radius:99px;background:color-mix(in srgb,var(--line) 70%,transparent);margin-top:4px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#a06bff)}
  .dim{color:var(--dim)}

  /* ---------- 分页 ---------- */
  .pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
  .pages{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .pg{min-width:30px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);
      color:var(--dim);font-size:12.5px;cursor:pointer;padding:0 9px;font-family:inherit;line-height:26px}
  .pg:hover:not([disabled]){color:var(--txt);border-color:var(--accent)}
  .pg.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .pg[disabled]{opacity:.35;cursor:default}
  .pg.gap{border:0;background:none;cursor:default}
  select.ps{background:var(--bg2);border:1px solid var(--line);border-radius:9px;color:var(--txt);
            font-size:12.5px;padding:6px 8px;outline:none;font-family:inherit}
  .pinfo{color:var(--dim);font-size:12px}

  /* ---------- 区服详情 ---------- */
  .mask{position:fixed;inset:0;background:rgba(6,10,18,.6);backdrop-filter:blur(2px);
        display:none;place-items:center;z-index:60;padding:20px}
  .mask.on{display:grid}
  .dcard{width:min(760px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;
         padding:20px 20px 16px;position:relative;max-height:86vh;overflow:auto}
  .dcard h3{margin:0;font-size:18px;letter-spacing:.3px}
  .dcard .x{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--dim);
            font-size:22px;line-height:1;cursor:pointer}
  .dcard .x:hover{color:var(--txt)}
  .dsub{color:var(--dim);font-size:12.5px;margin-top:3px}
  .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 10px}
  .kv div{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:9px 12px}
  .kv span{display:block;font-size:11px;color:var(--dim);letter-spacing:.4px}
  .kv b{font-size:15.5px;font-variant-numeric:tabular-nums}
  .roster{width:100%;border-collapse:collapse}
  .roster th{font-size:11px;color:var(--dim);font-weight:500;text-align:left;padding:7px 8px;
             border-bottom:1px solid var(--line)}
  .roster td{padding:7px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);font-size:13px}
  .roster .no{color:var(--dim);width:38px}
  .dnote{color:var(--dim);font-size:11.5px;margin-top:10px}
  .pavatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--bg2);
           border:1px solid var(--line);vertical-align:middle}
  .pcell{display:flex;align-items:center;gap:10px;min-width:150px}
  .pcell .nm{font-weight:600}
  .pcell .ar{display:block;font-size:11px;color:var(--dim);font-weight:400}

  /* ---------- 玩家详情 ---------- */
  .phead{display:flex;align-items:center;gap:16px;margin:14px 0 6px}
  .phead img{width:64px;height:64px;border-radius:16px;object-fit:cover;background:var(--bg2);
             border:1px solid var(--line)}
  .phead .pid{color:var(--dim);font-size:12px;margin-top:2px}
  .attgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px}
  .attgrid div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
  .attgrid span{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.3px}
  .attgrid b{font-size:13.5px;font-variant-numeric:tabular-nums;word-break:break-all}
  .tz{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 4px}
  .tz .t{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px}
  .tz .t img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px;background:color-mix(in srgb,var(--line) 35%,transparent)}
  .tz .t .tn{font-weight:600;font-size:12.5px;margin-top:6px}
  .tz .t .tl{font-size:11px;color:var(--dim)}
  .tz .t .b{font-size:12px;margin-top:4px}
  .tz .t .exs{display:flex;flex-wrap:wrap;gap:3px 5px;margin-top:6px;font-size:10.5px;
              color:var(--dim);line-height:1.5;min-height:0}
  .tz .t .st{color:#f5a623;font-size:12px;letter-spacing:1px;font-weight:700}
  .tz .t .ex{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:6px;
             border:1px solid color-mix(in srgb,currentColor 35%,transparent);
             background:color-mix(in srgb,currentColor 8%,transparent)}
  .ex-green{color:#3fb950} .ex-blue{color:#4aa8ff} .ex-purple{color:#b26bff}
  .ex-orange{color:#f0883e} .ex-red{color:#f85149} .ex-white{color:var(--txt)}
  .ex-cyan{color:#39c5cf}
  .sec-t{font-size:13px;font-weight:600;margin:14px 0 6px;letter-spacing:.3px}
  .sec-t .tag{font-size:11px;color:var(--dim);font-weight:400;margin-left:8px}
  .sumline{display:flex;flex-wrap:wrap;gap:8px}
  .sumline span{font-size:12px;background:var(--bg2);border:1px solid var(--line);
                border-radius:8px;padding:4px 10px;color:var(--dim)}
  .sumline b{color:var(--txt)}

  /* ---------- 运行记录 ---------- */
  .runs{display:flex;flex-wrap:wrap;gap:8px}
  .run{font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--dim)}
  .run.ok{border-color:color-mix(in srgb,var(--up) 45%,transparent)}
  .run.bad{border-color:color-mix(in srgb,var(--down) 55%,transparent);color:var(--down)}
  footer{color:var(--dim);font-size:11.5px;text-align:center;margin-top:26px}

  /* 数据不是最新的（最近一次抓取失败/被判定残缺）时的提示条 */
  .stale[hidden]{display:none}
  .stale{
    display:flex;align-items:center;gap:10px;margin-bottom:16px;
    border:1px solid color-mix(in srgb,var(--down) 45%,transparent);
    background:color-mix(in srgb,var(--down) 8%,transparent);
    border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--dim);
  }
  .stale b{color:var(--down)}

  /* ---------- 管理员验证 ---------- */
  .adminlock{margin-left:10px;display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
  .adminlock input{background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--txt);
                   padding:5px 9px;font-size:12.5px;width:110px;outline:none;font-family:inherit}
  .adminlock input:focus{border-color:var(--accent)}
  .adminlock button{background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--dim);
                    font-size:12px;padding:5px 10px;cursor:pointer;font-family:inherit}
  .adminlock button:hover{color:var(--txt);border-color:var(--accent)}
  .adminlock .ok{color:var(--up)}
  .adminlock .err{color:var(--down)}

  @media(max-width:820px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .chart-wrap{height:230px}
    .kv{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo">⚔</div>
      <div>
        <h1>次神：光之觉醒 · 区服战力榜</h1>
        <p class="sub">
          数据时间 <b>2026-11-06 14:00</b> ·
          下次更新 <b id="cd">--:--</b> ·
          <span class="scope" id="scope">2000-3000 区</span>
          <span class="admin" id="admin"></span>
        </p>
      </div>
    </div>
    <div class="adminbar" id="adminbar" hidden></div>
    <button class="ghost" id="theme">切换明暗</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="stale" id="stale" hidden></div>

  <div class="panel">
    <div class="panel-head">
      <h2>区战力趋势 <span class="tag">每个点 = 该区前 20 名 PVE 之和 · 点图例可开关</span></h2>
      <div class="segs">
        <div class="seg" id="mode">
          <button data-m="abs" class="on">绝对战力</button>
          <button data-m="pct">涨幅 %</button>
        </div>
      </div>
    </div>
    <div class="chart-wrap"><svg id="chart"></svg></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>区服榜 <span class="tag" id="cnt"></span></h2>
      <div class="tools">
        <button type="button" id="mysrv" class="chip" hidden></button>
        <input type="search" id="q" placeholder="搜索区号 / 玩家 / 公会">
        <button type="button" class="linkbtn" id="reset">重置筛选</button>
      </div>
    </div>
    <div class="tbl-scroll">
      <table>
        <thead>
          <tr>
            <th style="width:60px">名次</th>
            <th style="width:56px">变化</th>
            <th style="width:150px" class="sortable on" data-k="num">区服<span class="arw">▼</span></th>
            <th style="width:190px" class="sortable" data-k="sum">PVE 区战力<span class="arw">▼</span></th>
            <th style="width:150px" class="sortable" data-k="pvp">PVP 区战力<span class="arw">▼</span></th>
            <th style="width:150px" class="sortable" data-k="top1">区冠 PVE<span class="arw">▼</span></th>
            <th style="width:150px" class="sortable" data-k="top1_pvp">区冠 PVP<span class="arw">▼</span></th>
            <th style="width:110px" class="sortable" data-k="avg">前 20 平均<span class="arw">▼</span></th>
            <th style="width:76px">上榜</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager">
      <div class="pages" id="pages"></div>
      <div class="pages">
        <span class="pinfo" id="pinfo"></span>
        <select class="ps" id="psize">
          <option value="25">每页 25</option>
          <option value="50" selected>每页 50</option>
          <option value="100">每页 100</option>
          <option value="0">全部</option>
        </select>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>运行记录 <span class="tag" id="runtag">仅管理员可见</span></h2></div>
    <div class="runs" id="runs"></div>
  </div>

  <footer>由 power-rank 自动生成 · 每次抓取自动重写本页面 · 无外部依赖，可离线打开</footer>
</div>

<div class="mask" id="mask">

        + esc((+sd[2]) + '/' + (+sd[3])) + ' 的（' + siteDays + ' 天前）'
        + ' · 本页每小时都在正常抓取，但上游站主还没出新数据';
      el.hidden = false;
      return;
    }

    if(!stale && lastRun.ok !== 0) return;

    // 把技术性报错翻译成一句人话
    var raw = String(lastRun.error || '');
    var why;
    if(raw.indexOf('站点不可达') >= 0)        why = '抓取站点连不上（多半是代理软件没开）';
    else if(raw.indexOf('抓取残缺') >= 0)     why = '上次只抓到很少的区，判定为残缺，没有覆盖本页';
    else if(raw)                              why = raw.split('\n')[0].slice(0, 100);
    else                                      why = '已 ' + Math.floor(age/60) + ' 小时没有新数据';

    el.innerHTML = '<b>数据不是最新的</b> · 页面停留在 '
      + esc((D.snapshot_ts||'').slice(5,16).replace('T',' '))
      + ' 那一份 · ' + esc(why);

  /* ---------- 趋势图 ---------- */
  var chartMode = 'abs';

  function drawChart(){
    var items = D.series.items || [], labels = D.series.labels || [];
    var on = items.filter(function(it){ return active[it.key] !== false; });
    var W = svg.clientWidth || 900, H = svg.clientHeight || 290;
    var padL = 62, padR = 18, padT = 14, padB = 26;
    var iw = Math.max(10, W - padL - padR), ih = Math.max(10, H - padT - padB);

    var vals = [];
    on.forEach(function(it){
      var base = null;
      (it.sum||[]).forEach(function(v){
        if(v==null) return;
        if(base===null) base = v;
        if(chartMode==='pct'){ if(base) vals.push((v/base-1)*100); }
        else vals.push(v);
      });
    });
    if(!vals.length){ svg.innerHTML=''; return; }
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    if(mn===mx){ mn -= 1; mx += 1; }
    var pad = (mx-mn)*0.12;
    mn -= pad; mx += pad;
    if(Math.min.apply(null, vals) >= 0) mn = Math.max(0, mn);

    function X(i){ return padL + (labels.length<=1 ? iw/2 : i*iw/(labels.length-1)); }
    function Y(v){ return padT + ih - (v-mn)/(mx-mn)*ih; }

    var s = [];
    // 网格 + y 轴刻度
    for(var g=0; g<=4; g++){
      var v = mn + (mx-mn)*g/4, y = Y(v);
      s.push('<line x1="'+padL+'" y1="'+y+'" x2="'+(padL+iw)+'" y2="'+y+'"/>');
      var txt = chartMode==='pct' ? (v.toFixed(2)+'%') : axisFmt(v);
      s.push('<text x="'+(padL-10)+'" y="'+(y+3.5)+'" text-anchor="end">'+esc(txt)+'</text>');
    }
    // x 轴标签：最多 6 个
    var step = Math.max(1, Math.ceil(labels.length/6));
    labels.forEach(function(t,i){
      if(i%step && i!==labels.length-1) return;
      s.push('<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle">'+esc((t||'').slice(5,16).replace('T',' '))+'</text>');
    });

    on.forEach(function(it){
      var d = [], base = null;
      (it.sum||[]).forEach(function(v,i){
        if(v==null) return;
        if(base===null) base = v;
        var y = chartMode==='pct' ? (base? (v/base-1)*100 : 0) : v;
        d.push(X(i)+','+Y(y));
      });
      if(d.length<2){                      // 只有一个数据点时画个点，别让图看着是空的
        if(d.length===1){
          var c0 = d[0].split(',');
          s.push('<circle cx="'+c0[0]+'" cy="'+c0[1]+'" r="3.5" fill="'+PALETTE[items.indexOf(it) % PALETTE.length]+'"/>');
        }
        return;
      }
      var color = PALETTE[items.indexOf(it) % PALETTE.length];
      s.push('<polyline fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round" points="'+d.join(' ')+'"/>');
      var last = d[d.length-1].split(',');
      s.push('<circle cx="'+last[0]+'" cy="'+last[1]+'" r="3" fill="'+color+'"/>');
    });

    if(labels.length < 2){
      s.push('<text x="'+(padL+iw/2)+'" y="'+(padT+ih/2-10)+'" text-anchor="middle" class="hint">'
        + '现在只有 1 个数据点 —— 再过一小时就有趋势线了</text>');
    }
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.innerHTML = '<g class="grid">'+s.join('')+'</g>';
  }

    var box = document.getElementById('pages');

    if(pages <= 1){ box.innerHTML=''; return; }
    var out = [];

      out.push('<button class="pg'+(cls?' '+cls:'')+'" data-p="'+p+'"'+(dis?' disabled':'')+'>'+label+'</button>');
    }
    btn(1,'首页', page===1);
    btn(page-1,'上一页', page===1);
    var from = Math.max(1, page-2), to = Math.min(pages, page+2);
    if(from > 1) out.push('<button class="pg gap" disabled>…</button>');
    for(var i=from; i<=to; i++) btn(i, String(i), false, i===page?'on':'');
    if(to < pages) out.push('<button class="pg gap" disabled>…</button>');
    btn(page+1,'下一页', page===pages);
    btn(pages,'末页', page===pages);
    box.innerHTML = out.join('');

  function loadParts(list, done){

    function next(){
      if(i >= list.length){ if(done) done(); return; }
      loadPart(list[i]).then(next, function(){ i = list.length; if(done) done(); });
      i++;
    }
    next();
  }
  var chunked = el.getAttribute('data-parts');
  if(chunked){
    var parts = JSON.parse(chunked || '[]');
    loadParts(parts, afterMerge);
  }
})();
</script>
